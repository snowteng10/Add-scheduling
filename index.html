<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加做病人登記與後台管理系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- PapaParse for CSV Parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-3">
                    <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md">
                        <i class="fa-solid fa-id-card text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-slate-900 leading-tight">加做病人額度登記系統</h1>
                        <p class="text-xs text-slate-500">每人每月上限 3 次登記</p>
                    </div>
                </div>

                <!-- Navigation Tabs -->
                <div class="flex bg-slate-100 p-1 rounded-xl">
                    <button id="tab-user-btn" onclick="switchTab('user')" class="flex items-center space-x-2 px-4 py-2 rounded-lg font-medium text-sm transition-all duration-200 bg-white text-indigo-600 shadow-sm">
                        <i class="fa-solid fa-pen-to-square"></i>
                        <span>前台登記</span>
                    </button>
                    <button id="tab-admin-btn" onclick="switchTab('admin')" class="flex items-center space-x-2 px-4 py-2 rounded-lg font-medium text-sm transition-all duration-200 text-slate-600 hover:text-slate-900">
                        <i class="fa-solid fa-sliders"></i>
                        <span>後台管理與紀錄</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- Toast Notification Container -->
        <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

        <!-- USER TAB CONTENT -->
        <section id="tab-user" class="block transition-opacity duration-300">
            <div class="max-w-xl mx-auto">
                <div class="bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
                    <div class="bg-gradient-to-r from-indigo-600 to-indigo-800 p-6 text-white">
                        <h2 class="text-2xl font-bold mb-1">登記加做次數</h2>
                        <p class="text-indigo-100 text-sm">輸入卡號前 4 碼或完整代號搜尋，支援多筆結果點選！</p>
                    </div>

                    <div class="p-6 sm:p-8 space-y-6">
                        <div id="limit-alert" class="hidden bg-rose-50 border-l-4 border-rose-500 p-4 rounded-r-xl">
                            <div class="flex items-start">
                                <div class="flex-shrink-0">
                                    <i class
