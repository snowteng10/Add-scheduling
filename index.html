<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>使用次數登記與管理系統</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- PapaParse for CSV Parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

  <!-- 頂部導覽列 -->
  <header class="bg-indigo-600 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i data-lucide="clipboard-check" class="w-7 h-7"></i>
        <h1 class="text-xl font-bold tracking-wide">登記與次數管理系統</h1>
      </div>
      <div class="flex bg-indigo-700/60 p-1 rounded-xl text-sm font-medium">
        <button id="tab-front" onclick="switchTab('front')" class="px-4 py-1.5 rounded-lg transition-all bg-white text-indigo-700 shadow-sm">
          <i data-lucide="user-check" class="w-4 h-4 inline mr-1"></i> 前台登記
        </button>
        <button id="tab-back" onclick="switchTab('back')" class="px-4 py-1.5 rounded-lg transition-all text-indigo-100 hover:text-white">
          <i data-lucide="settings" class="w-4 h-4 inline mr-1"></i> 後台管理
        </button>
      </div>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="max-w-6xl mx-auto px-4 py-8">

    <!-- ================= 前台登記頁面 ================= -->
    <section id="front-page" class="max-w-md mx-auto">
      <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
        <div class="bg-indigo-600 px-6 py-5 text-white">
          <h2 class="text-xl font-bold">登記使用次數</h2>
          <p class="text-indigo-100 text-xs mt-1">輸入個人代號（支援前 4 碼快速檢索），系統自動帶出姓名。</p>
        </div>

        <form id="checkin-form" class="p-6 space-y-5" onsubmit="handleCheckin(event)">
          <!-- 代號輸入 -->
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">個人代號 (Code)</label>
            <div class="relative">
              <i data-lucide="barcode" class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
              <input type="text" id="input-code" oninput="onCodeInput()" autocomplete="off" placeholder="例如：3842 (至少輸入4碼)" 
                     class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition uppercase text-lg tracking-wider font-mono">
            </div>
          </div>

          <!-- 多筆相符時的選擇下拉選單 -->
          <div id="multi-user-container" class="hidden bg-amber-50 border border-amber-200 rounded-xl p-3 space-y-2">
            <div class="text-xs font-semibold text-amber-800 flex items-center">
              <i data-lucide="users" class="w-4 h-4 mr-1"></i> 找到多筆符合代號，請選擇人員：
            </div>
            <select id="select-user" onchange="onUserSelected(this.value)" class="w-full bg-white border border-amber-300 rounded-lg p-2 text-sm text-slate-700 focus:ring-2 focus:ring-amber-500 outline-none">
              <!-- 動態載入選項 -->
            </select>
          </div>

          <!-- 自動帶出姓名與當月次數資訊 -->
          <div id="info-card" class="bg-slate-50 border border-slate-200 rounded-xl p-4 transition-all">
            <div class="flex justify-between items-center mb-1">
              <span class="text-xs font-medium text-slate-500">自動對照姓名</span>
              <span id="current-month-tag" class="text-[10px] bg-slate-200 text-slate-600 font-mono px-2 py-0.5 rounded-full"></span>
            </div>
            <div id="user-name" class="text-lg font-bold text-slate-800 flex items-center min-h-[28px]">
              <span class="text-slate-400 font-normal text-sm">請輸入代號進行比對...</span>
            </div>

            <!-- 次數提示條 -->
            <div id="usage-status-bar" class="hidden mt-3 pt-3 border-t border-slate-200/60">
              <div class="flex justify-between text-xs font-semibold mb-1.5">
                <span>本月已使用次數</span>
                <span id="usage-text" class="font-mono">0 / 3 次</span>
              </div>
              <div class="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden">
                <div id="usage-progress" class="bg-indigo-500 h-full w-0 transition-all duration-300"></div>
              </div>
            </div>
          </div>

          <!-- 警示訊息區域（達到 3 次時顯示紅底警告） -->
          <div id="alert-message" class="hidden rounded-xl p-3.5 text-sm border flex items-start space-x-2.5 shadow-sm transition-all"></div>

          <!-- 提交按鈕 -->
          <button type="submit" id="submit-btn" disabled 
                  class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-semibold rounded-xl shadow-md hover:shadow-lg transition-all flex items-center justify-center space-x-2">
            <i data-lucide="check-circle-2" class="w-5 h-5"></i>
            <span>確認登記使用</span>
          </button>
        </form>
      </div>
    </section>

    <!-- ================= 後台管理頁面 ================= -->
    <section id="back-page" class="hidden space-y-6">
      
      <!-- 後台功能區卡片網格 -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- 左側：新增 / 匯入人員資料 -->
        <div class="bg-white rounded-2xl shadow-md border border-slate-100 p-5 space-y-4">
          <div class="flex items-center space-x-2 border-b border-slate-100 pb-3">
            <i data-lucide="user-plus" class="w-5 h-5 text-indigo-600"></i>
            <h3 class="font-bold text-slate-800">人員對照表管理</h3>
          </div>

          <!-- CSV 批次匯入 -->
          <div class="bg-indigo-50/50 border border-indigo-100 rounded-xl p-3">
            <label class="block text-xs font-bold text-indigo-900 mb-1">批次匯入 CSV 名單</label>
            <input type="file" id="csv-file-input" accept=".csv" class="hidden" onchange="handleCSVUpload(event)">
            <button onclick="document.getElementById('csv-file-input').click()" class="w-full py-2 px-3 bg-white border border-indigo-200 hover:bg-indigo-50 text-indigo-700 rounded-lg text-xs font-semibold shadow-sm transition flex items-center justify-center space-x-1">
              <i data-lucide="upload" class="w-4 h-4"></i>
              <span>選擇 CSV 檔案匯入</span>
            </button>
          </div>

          <!-- 單筆新增表單 -->
          <form onsubmit="handleAddUser(event)" class="space-y-3 pt-1">
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">代號 (Code)</label>
                <input type="text" id="new-code" required placeholder="如：3842B" class="w-full px-3 py-1.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none uppercase font-mono">
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">姓名 (Name)</label>
                <input type="text" id="new-name" required placeholder="如：王國強" class="w-full px-3 py-1.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
              </div>
            </div>
            <button type="submit" class="w-full py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-lg text-xs font-semibold shadow transition">
              新增 / 更新單筆人員
            </button>
          </form>

          <!-- 名單搜尋與列表 -->
          <div class="pt-2 border-t border-slate-100">
            <div class="flex justify-between items-center mb-2">
              <span class="text-xs font-bold text-slate-600">目前人員名單 (<span id="user-count">0</span>)</span>
              <input type="text" id="search-user-input" oninput="renderUserList()" placeholder="搜尋代號/姓名..." class="text-xs px-2 py-1 border rounded-md outline-none w-28">
            </div>
            <div id="user-list-box" class="max-h-48 overflow-y-auto space-y-1 pr-1 font-mono text-xs">
              <!-- 動態渲染名單 -->
            </div>
          </div>
        </div>

        <!-- 右側：登記紀錄與統計 (佔 2 欄) -->
        <div class="lg:col-span-2 bg-white rounded-2xl shadow-md border border-slate-100 p-5 space-y-4 flex flex-col justify-between">
          <div>
            <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-3 border-b border-slate-100 pb-3">
              <div class="flex items-center space-x-2">
                <i data-lucide="history" class="w-5 h-5 text-indigo-600"></i>
                <h3 class="font-bold text-slate-800">登記歷史紀錄</h3>
              </div>
              
              <!-- 篩選器與功能按鈕 -->
              <div class="flex items-center space-x-2">
                <select id="filter-month" onchange="renderLogs()" class="text-xs border border-slate-300 rounded-lg px-2 py-1.5 outline-none font-mono">
                  <!-- 月份動態載入 -->
                </select>
                <button onclick="exportLogsCSV()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-semibold shadow transition flex items-center space-x-1">
                  <i data-lucide="download" class="w-3.5 h-3.5"></i>
                  <span>匯出紀錄</span>
                </button>
                <button onclick="clearLogs()" class="px-2.5 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-lg text-xs font-semibold transition">
                  清空
                </button>
              </div>
            </div>

            <!-- 紀錄表格 -->
            <div class="mt-4 overflow-x-auto">
              <table class="w-full text-left text-xs text-slate-600">
                <thead class="bg-slate-50 text-slate-700 uppercase font-semibold">
                  <tr>
                    <th class="px-3 py-2.5 rounded-l-lg">時間</th>
                    <th class="px-3 py-2.5">代號</th>
                    <th class="px-3 py-2.5">姓名</th>
                    <th class="px-3 py-2.5 rounded-r-lg text-right">當月累積次數</th>
                  </tr>
                </thead>
                <tbody id="logs-tbody" class="divide-y divide-slate-100">
                  <!-- 動態載入歷史紀錄 -->
                </tbody>
              </table>
            </div>
          </div>

          <div class="text-right text-xs text-slate-400 pt-3 border-t border-slate-100">
            提示：資料保存在瀏覽器本地儲存區 (localStorage)。
          </div>
        </div>

      </div>

    </section>
  </main>

  <!-- JavaScript 邏輯 -->
  <script>
    const DEFAULT_USERS = [
      { code: "3842B", name: "王國強" },
      { code: "3842C", name: "李大同" },
      { code: "73006", name: "陳小美" },
      { code: "70050", name: "林志豪" }
    ];

    const MONTHLY_LIMIT = 3;
    let selectedUser = null;

    function getCurrentMonthKey() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      return `${year}-${month}`;
    }

    function initStorage() {
      if (!localStorage.getItem('users_map')) {
        localStorage.setItem('users_map', JSON.stringify(DEFAULT_USERS));
      }
      if (!localStorage.getItem('checkin_logs')) {
        localStorage.setItem('checkin_logs', JSON.stringify([]));
      }
    }

    function getUsers() {
      return JSON.parse(localStorage.getItem('users_map') || '[]');
    }

    function getLogs() {
      return JSON.parse(localStorage.getItem('checkin_logs') || '[]');
    }

    // 計算當月特定代號已登記的次數 (比對 YYYY-MM)
    function getUserMonthlyCount(code, monthKey) {
      const logs = getLogs();
      const formatMonth = monthKey.replace('-', '/');
      return logs.filter(log => log.code === code && (log.date.startsWith(monthKey) || log.date.startsWith(formatMonth))).length;
    }

    function switchTab(tab) {
      const frontPage = document.getElementById('front-page');
      const backPage = document.getElementById('back-page');
      const tabFront = document.getElementById('tab-front');
      const tabBack = document.getElementById('tab-back');

      if (tab === 'front') {
        frontPage.classList.remove('hidden');
        backPage.classList.add('hidden');
        tabFront.className = "px-4 py-1.5 rounded-lg transition-all bg-white text-indigo-700 shadow-sm";
        tabBack.className = "px-4 py-1.5 rounded-lg transition-all text-indigo-100 hover:text-white";
      } else {
        frontPage.classList.add('hidden');
        backPage.classList.remove('hidden');
        tabBack.className = "px-4 py-1.5 rounded-lg transition-all bg-white text-indigo-700 shadow-sm";
        tabFront.className = "px-4 py-1.5 rounded-lg transition-all text-indigo-100 hover:text-white";
        renderUserList();
        renderLogsFilter();
        renderLogs();
      }
    }

    function onCodeInput() {
      const inputVal = document.getElementById('input-code').value.trim().toUpperCase();
      const users = getUsers();
      const multiContainer = document.getElementById('multi-user-container');
      const selectUser = document.getElementById('select-user');

      selectedUser = null;
      multiContainer.classList.add('hidden');
      selectUser.innerHTML = '';

      if (inputVal.length < 3) {
        updateUserInfoDisplay(null, null, '請輸入代號進行比對...');
        return;
      }

      const matches = users.filter(u => u.code.toUpperCase().startsWith(inputVal));

      if (matches.length === 0) {
        updateUserInfoDisplay(null, 'error', '⚠️ 查無此代號，請確認或向管理員詢問');
      } else if (matches.length === 1) {
        selectedUser = matches[0];
        updateUserInfoDisplay(selectedUser);
      } else {
        multiContainer.classList.remove('hidden');
        selectUser.innerHTML = '<option value="">-- 請點選選擇正確的人員 --</option>';
        matches.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m.code;
          opt.textContent = `${m.code} - ${m.name}`;
          selectUser.appendChild(opt);
        });
        updateUserInfoDisplay(null, 'warning', `🔍 找到 ${matches.length} 筆符合項目，請於上方點選選擇`);
      }
    }

    function onUserSelected(code) {
      if (!code) {
        selectedUser = null;
        updateUserInfoDisplay(null, null, '請選擇人員...');
        return;
      }
      const users = getUsers();
      selectedUser = users.find(u => u.code === code);
      if (selectedUser) {
        updateUserInfoDisplay(selectedUser);
      }
    }

    function updateUserInfoDisplay(user, alertType = null, alertMsg = '') {
      const nameBox = document.getElementById('user-name');
      const alertBox = document.getElementById('alert-message');
      const submitBtn = document.getElementById('submit-btn');
      const usageBar = document.getElementById('usage-status-bar');
      const usageText = document.getElementById('usage-text');
      const usageProgress = document.getElementById('usage-progress');

      alertBox.classList.add('hidden');
      submitBtn.disabled = true;

      if (!user) {
        nameBox.innerHTML = `<span class="text-slate-400 font-normal text-sm">${alertMsg}</span>`;
        usageBar.classList.add('hidden');

        if (alertType === 'error') {
          alertBox.className = "rounded-xl p-3.5 text-sm flex items-start space-x-2 bg-rose-50 text-rose-700 border border-rose-200";
          alertBox.innerHTML = `<i data-lucide="alert-circle" class="w-5 h-5 shrink-0 mt-0.5"></i><span>${alertMsg}</span>`;
          alertBox.classList.remove('hidden');
        }
        lucide.createIcons();
        return;
      }

      const monthKey = getCurrentMonthKey();
      const currentCount = getUserMonthlyCount(user.code, monthKey);
      
      nameBox.innerHTML = `<span class="text-indigo-600 font-mono mr-2">[${user.code}]</span>${user.name}`;
      
      usageBar.classList.remove('hidden');
      usageText.textContent = `${currentCount} / ${MONTHLY_LIMIT} 次`;
      const percentage = Math.min((currentCount / MONTHLY_LIMIT) * 100, 100);
      usageProgress.style.width = `${percentage}%`;

      // 達到或超過 3 次時觸發警示
      if (currentCount >= MONTHLY_LIMIT) {
        usageProgress.className = "bg-rose-500 h-full w-0 transition-all duration-300";
        alertBox.className = "rounded-xl p-3.5 text-sm flex items-start space-x-2.5 bg-rose-50 text-rose-700 border border-rose-300 shadow-sm";
        alertBox.innerHTML = `
          <i data-lucide="alert-triangle" class="w-5 h-5 shrink-0 text-rose-600 mt-0.5"></i>
          <div>
            <div class="font-bold text-base">⚠️ 無法再登記使用（已達上限）</div>
            <div class="text-xs text-rose-600 mt-1 leading-relaxed">該人員本月已登記 ${currentCount} 次，達到上限 ${MONTHLY_LIMIT} 次規定。系統拒絕再次登記。</div>
          </div>`;
        alertBox.classList.remove('hidden');
        submitBtn.disabled = true;
      } else {
        usageProgress.className = "bg-indigo-500 h-full w-0 transition-all duration-300";
        alertBox.className = "rounded-xl p-3.5 text-sm flex items-start space-x-2 bg-emerald-50 text-emerald-800 border border-emerald-200";
        alertBox.innerHTML = `
          <i data-lucide="check-circle" class="w-5 h-5 shrink-0 text-emerald-600 mt-0.5"></i>
          <div>
            <div class="font-bold">可正常登記</div>
            <div class="text-xs text-emerald-700 mt-0.5">本月已使用 ${currentCount} 次，剩餘可使用次數：${MONTHLY_LIMIT - currentCount} 次。</div>
          </div>`;
        alertBox.classList.remove('hidden');
        submitBtn.disabled = false;
      }
      lucide.createIcons();
    }

    function handleCheckin(e)
